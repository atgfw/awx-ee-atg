---
# Heavy Execution Environment - includes Playwright for UI automation
version: 3
images:
  base_image:
    name: quay.io/centos/centos:stream9
dependencies:
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11
  ansible_core:
    # Require minimum of 2.15 to get ansible-inventory --limit option
    package_pip: ansible-core>=2.15.0rc2,<2.16
  ansible_runner:
    package_pip: ansible-runner
  galaxy: |
    ---
    collections:
      - name: awx.awx
      - name: netbox.netbox
      - name: ansibleguy.opnsense
  system: |
    git-core [platform:rpm]
    python3.11-devel [platform:rpm compile]
    libcurl-devel [platform:rpm compile]
    krb5-devel [platform:rpm compile]
    krb5-workstation [platform:rpm]
    subversion [platform:rpm]
    subversion [platform:dpkg]
    git-lfs [platform:rpm]
    sshpass [platform:rpm]
    rsync [platform:rpm]
    epel-release [platform:rpm]
    unzip [platform:rpm]
    podman-remote [platform:rpm]
    cmake [platform:rpm compile]
    gcc [platform:rpm compile]
    gcc-c++ [platform:rpm compile]
    make [platform:rpm compile]
    openssl-devel [platform:rpm compile]
    # Playwright Dependencies for EL9
    alsa-lib [platform:rpm]
    atk [platform:rpm]
    at-spi2-atk [platform:rpm]
    at-spi2-core [platform:rpm]
    cairo [platform:rpm]
    cups-libs [platform:rpm]
    dbus-libs [platform:rpm]
    expat [platform:rpm]
    flac-libs [platform:rpm]
    gdk-pixbuf2 [platform:rpm]
    glib2 [platform:rpm]
    gtk3 [platform:rpm]
    libatomic [platform:rpm]
    libdatrie [platform:rpm]
    libdrm [platform:rpm]
    liberation-fonts [platform:rpm]
    libgbm [platform:rpm]
    libgcc [platform:rpm]
    libjpeg-turbo [platform:rpm]
    libpng [platform:rpm]
    libstdc++ [platform:rpm]
    libthai [platform:rpm]
    libX11 [platform:rpm]
    libXcomposite [platform:rpm]
    libXcursor [platform:rpm]
    libXdamage [platform:rpm]
    libXext [platform:rpm]
    libXfixes [platform:rpm]
    libXi [platform:rpm]
    libXrandr [platform:rpm]
    libXrender [platform:rpm]
    libxkbcommon [platform:rpm]
    libXtst [platform:rpm]
    libuuid [platform:rpm]
    libxcb [platform:rpm]
    mesa-libgbm [platform:rpm]
    nspr [platform:rpm]
    nss [platform:rpm]
    pango [platform:rpm]
    systemd-libs [platform:rpm]
    xdg-utils [platform:rpm]
    xorg-x11-server-Xvfb [platform:rpm]
  python: |
    httpx
    pynetbox
    ansible
    lxml
    jmespath
    playwright

additional_build_steps:
  prepend_base:
    - RUN echo Building Heavy EE with Playwright support
    # Enable Non-default stream before packages provided by it can be installed. (optional)
    - RUN dnf module install nodejs:20 -y
  append_final:
    # Install Playwright browsers (deps already installed via system packages above)
    - RUN playwright install chromium
